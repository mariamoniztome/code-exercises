<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>A Árvore dos Versos — Poeta Carpinteiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --sepia: #c8a96e;
      --sepia-dark: #7a5c2e;
      --sepia-light: #f0e0c0;
      --ink: #1a1008;
      --paper: #f5ead0;
      --paper-dark: #e8d4a8;
      --rust: #8b3a1a;
      --moss: #3a5c2e;
      --mist: rgba(200,169,110,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ink);
      font-family: 'Crimson Text', serif;
      color: var(--paper);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ═══════════════════════════════════════
       SCREEN 1 — TIMELINE
    ═══════════════════════════════════════ */
    #screen-timeline {
      position: fixed;
      inset: 0;
      background: var(--ink);
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 100;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #screen-timeline.exit {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Grain overlay */
    #screen-timeline::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }

    .tl-header {
      padding: 60px 40px 40px;
      text-align: center;
      position: relative;
    }

    .tl-eyebrow {
      font-family: 'Crimson Text', serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--sepia);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
    }

    .tl-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--paper);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.8s 0.4s forwards;
    }

    .tl-title em {
      font-style: italic;
      color: var(--sepia);
    }

    .tl-subtitle {
      font-family: 'IM Fell English', serif;
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-style: italic;
      color: var(--sepia);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.8s 0.6s forwards;
    }

    .tl-dates {
      display: inline-block;
      font-family: 'Crimson Text', serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--sepia-dark);
      border-top: 1px solid var(--sepia-dark);
      border-bottom: 1px solid var(--sepia-dark);
      padding: 6px 20px;
      opacity: 0;
      animation: fadeUp 0.8s 0.8s forwards;
    }

    /* Decorative rule */
    .tl-ornament {
      text-align: center;
      color: var(--sepia);
      font-size: 1.4rem;
      margin: 24px 0;
      opacity: 0;
      animation: fadeUp 0.8s 1s forwards;
    }

    /* Portrait */
    .tl-portrait-wrap {
      display: flex;
      justify-content: center;
      margin: 0 auto 48px;
      opacity: 0;
      animation: fadeUp 0.8s 1.1s forwards;
    }

    .tl-portrait {
      width: 140px;
      height: 180px;
      border-radius: 2px;
      background: var(--sepia-dark);
      border: 3px solid var(--sepia);
      box-shadow: 0 0 0 1px var(--sepia-dark), 8px 8px 0 var(--sepia-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--sepia);
      position: relative;
      overflow: hidden;
    }

    .tl-portrait svg {
      width: 70px;
      height: 70px;
      opacity: 0.6;
    }

    /* Bio excerpt */
    .tl-bio {
      max-width: 560px;
      margin: 0 auto 48px;
      padding: 0 32px;
      text-align: center;
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--paper-dark);
      opacity: 0;
      animation: fadeUp 0.8s 1.3s forwards;
    }

    /* ─── Timeline ─── */
    .tl-timeline {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 24px 40px;
      position: relative;
    }

    .tl-timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--sepia-dark) 5%, var(--sepia-dark) 95%, transparent);
      transform: translateX(-50%);
    }

    .tl-event {
      display: flex;
      align-items: flex-start;
      margin-bottom: 40px;
      position: relative;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .tl-event.visible { opacity: 1; transform: translateY(0); }
    .tl-event:nth-child(odd) { flex-direction: row; }
    .tl-event:nth-child(even) { flex-direction: row-reverse; }

    .tl-event-content {
      width: calc(50% - 28px);
      background: rgba(122, 92, 46, 0.08);
      border: 1px solid rgba(200,169,110,0.2);
      border-radius: 2px;
      padding: 16px 20px;
      transition: background 0.3s, border-color 0.3s;
      position: relative;
    }

    .tl-event:nth-child(odd) .tl-event-content { margin-right: 28px; }
    .tl-event:nth-child(even) .tl-event-content { margin-left: 28px; }

    .tl-event:hover .tl-event-content {
      background: rgba(122,92,46,0.18);
      border-color: rgba(200,169,110,0.5);
    }

    .tl-event-year {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--sepia);
      line-height: 1;
      margin-bottom: 4px;
    }

    .tl-event-title {
      font-family: 'Crimson Text', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--paper);
      margin-bottom: 6px;
    }

    .tl-event-desc {
      font-family: 'Crimson Text', serif;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--paper-dark);
    }

    /* Dot on the line */
    .tl-dot {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: var(--sepia-dark);
      border: 2px solid var(--sepia);
      border-radius: 50%;
      z-index: 2;
      transition: background 0.3s, transform 0.3s;
    }

    .tl-event:hover .tl-dot {
      background: var(--sepia);
      transform: translateX(-50%) scale(1.3);
    }

    /* ─── CTA ─── */
    .tl-cta-wrap {
      text-align: center;
      padding: 48px 32px 80px;
    }

    .tl-cta-label {
      font-family: 'Crimson Text', serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--sepia-dark);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
    }

    .tl-cta {
      display: inline-block;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--ink);
      background: var(--sepia);
      border: none;
      padding: 16px 48px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      border-radius: 1px;
      box-shadow: 4px 4px 0 var(--sepia-dark);
      opacity: 0;
      animation: fadeUp 0.8s 0.4s forwards;
    }

    .tl-cta:hover {
      background: var(--paper);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--sepia-dark);
    }

    .tl-cta:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--sepia-dark); }

    /* ═══════════════════════════════════════
       SCREEN 3 — AR SCENE
    ═══════════════════════════════════════ */
    #screen-ar {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
    }

    #screen-ar.active { display: block; }

    #ar-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #ar-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* AR HUD */
    #ar-hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }

    .ar-hud-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: white;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .ar-hud-title span {
      display: block;
      font-family: 'Crimson Text', serif;
      font-size: 0.75rem;
      font-style: italic;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
    }

    #ar-back {
      pointer-events: all;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      font-family: 'Crimson Text', serif;
      font-size: 0.85rem;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 1px;
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
    }

    /* AR Status bar */
    #ar-status {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      z-index: 10;
    }

    #ar-status-text {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1rem;
      color: rgba(255,255,255,0.9);
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      margin-bottom: 8px;
    }

    /* Poem display overlay */
    #ar-poem-display {
      position: absolute;
      bottom: 80px; left: 24px; right: 24px;
      background: rgba(26,16,8,0.85);
      border: 1px solid rgba(200,169,110,0.4);
      border-radius: 2px;
      padding: 20px 24px;
      backdrop-filter: blur(8px);
      z-index: 10;
      display: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    #ar-poem-display.visible {
      display: block;
      opacity: 1;
    }

    #ar-poem-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--sepia);
      margin-bottom: 10px;
    }

    #ar-poem-text {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.8;
      color: var(--paper);
    }

    /* Loading state */
    #ar-loading {
      position: absolute;
      inset: 0;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.5s;
    }

    #ar-loading.hidden { opacity: 0; pointer-events: none; }

    .ar-loading-text {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      color: var(--sepia);
      font-size: 1rem;
      margin-top: 20px;
      animation: pulse 2s infinite;
    }

    .ar-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--sepia-dark);
      border-top-color: var(--sepia);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Marker guide */
    #marker-guide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 9;
    }

    .marker-reticle {
      width: 200px;
      height: 200px;
      border: 2px solid rgba(200,169,110,0.6);
      border-radius: 4px;
      position: relative;
      animation: reticle-pulse 2s ease-in-out infinite;
    }

    .marker-reticle::before, .marker-reticle::after {
      content: '';
      position: absolute;
      background: var(--sepia);
    }

    .marker-reticle::before { top: -6px; left: -6px; right: -6px; height: 1px; }
    .marker-reticle::after { left: -6px; top: -6px; bottom: -6px; width: 1px; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes reticle-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }

    /* Scrollbar */
    #screen-timeline::-webkit-scrollbar { width: 4px; }
    #screen-timeline::-webkit-scrollbar-track { background: var(--ink); }
    #screen-timeline::-webkit-scrollbar-thumb { background: var(--sepia-dark); border-radius: 2px; }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .tl-timeline::before { left: 20px; }
      .tl-event, .tl-event:nth-child(even) { flex-direction: column; padding-left: 44px; }
      .tl-event-content, .tl-event:nth-child(odd) .tl-event-content,
      .tl-event:nth-child(even) .tl-event-content { width: 100%; margin: 0; }
      .tl-dot { left: 20px; top: 18px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     SCREEN 1 — TIMELINE
═══════════════════════════════════════ -->
<div id="screen-timeline">

  <header class="tl-header">
    <p class="tl-eyebrow" id="tl-eyebrow"></p>
    <h1 class="tl-title" id="tl-title"></h1>
    <p class="tl-subtitle" id="tl-subtitle"></p>
    <span class="tl-dates" id="tl-dates"></span>
  </header>

  <div class="tl-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>

  <div class="tl-portrait-wrap">
    <div class="tl-portrait">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="35" r="18" stroke="currentColor" stroke-width="1.5"/>
        <path d="M20 85 C20 60 80 60 80 85" stroke="currentColor" stroke-width="1.5"/>
        <path d="M38 72 L50 58 L62 72" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <line x1="44" y1="80" x2="44" y2="92" stroke="currentColor" stroke-width="1" opacity="0.4"/>
        <line x1="56" y1="80" x2="56" y2="92" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <p class="tl-bio" id="tl-bio"></p>

  <!-- Timeline events -->
  <div class="tl-timeline" id="tl-events-container"></div>

  <!-- CTA -->
  <div class="tl-cta-wrap">
    <p class="tl-cta-label" id="tl-cta-label"></p>
    <button class="tl-cta" id="btn-enter-ar"></button>
  </div>

</div>

<!-- ═══════════════════════════════════════
     SCREEN 3 — AR SCENE
═══════════════════════════════════════ -->
<div id="screen-ar">
  <video id="ar-video" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>

  <div id="ar-loading">
    <div class="ar-spinner"></div>
    <p class="ar-loading-text" id="ar-loading-text"></p>
  </div>

  <div id="marker-guide">
    <div class="marker-reticle"></div>
  </div>

  <div id="ar-hud">
    <div class="ar-hud-title">
      <span id="ar-hud-title-text"></span>
      <span id="ar-poem-indicator"></span>
    </div>
    <button id="ar-back"></button>
  </div>

  <div id="ar-poem-display">
    <div id="ar-poem-title"></div>
    <div id="ar-poem-text"></div>
  </div>

  <div id="ar-status">
    <div id="ar-status-text">Aponta a câmara para o QR impresso</div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script src="js/content/content-hydrator.js?v=20260329b"></script>
<script src="js/ar/ar-engine.js?v=20260329b"></script>
<script src="js/controllers/model-interaction-controller.js?v=20260329b"></script>
<script src="js/poems/poem-vilar-scene.js?v=20260329b"></script>
<script src="js/poems/poem-farol-scene.js?v=20260329b"></script>
<script src="js/poems/poem-campo-scene.js?v=20260329b"></script>
<script src="js/core/tree-of-verses.js?v=20260329b"></script>
<script src="js/core/app-state.js?v=20260329b"></script>
<script src="js/controllers/ar-session-controller.js?v=20260329b"></script>
<script src="js/controllers/ui-controller.js?v=20260329b"></script>
<script src="js/app/app.js?v=20260329b"></script>

</body>
</html>
