<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcadores — A Árvore dos Versos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f5ead0;font-family:'Crimson Text',serif;color:#1a1008;padding:32px 24px}
    .page-header{text-align:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid #c8a96e}
    .page-title{font-family:'Playfair Display',serif;font-size:2rem;color:#1a1008;margin-bottom:6px}
    .page-sub{font-family:'IM Fell English',serif;font-style:italic;color:#7a5c2e;font-size:1rem;margin-bottom:16px}
    .instruction{font-size:.88rem;color:#5c3a1a;line-height:1.7;max-width:520px;margin:0 auto}
    .instruction strong{color:#7a5c2e}
    .markers-grid{display:flex;flex-direction:column;gap:0;max-width:640px;margin:0 auto}
    .marker-item{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:start;padding:28px 0;border-bottom:1px dashed #c8a96e}
    .marker-item:last-child{border-bottom:none}
    .marker-qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
    .marker-frame{width:160px;height:160px;border:3px solid #1a1008;padding:8px;background:white;position:relative;box-shadow:inset 0 0 0 1px #e8d4a8}
    .marker-frame::before,.marker-frame::after{content:'';position:absolute;width:16px;height:16px;border-color:#7a5c2e;border-style:solid}
    .marker-frame::before{top:-6px;left:-6px;border-width:3px 0 0 3px}
    .marker-frame::after{bottom:-6px;right:-6px;border-width:0 3px 3px 0}
    .qr-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .qr-container canvas,.qr-container img{width:100%!important;height:100%!important}
    .marker-id-label{font-family:'Playfair Display',serif;font-size:.75rem;letter-spacing:3px;color:#7a5c2e;text-transform:uppercase}
    .marker-qr-code{font-family:'Crimson Text',serif;font-size:.65rem;color:#c8a96e;letter-spacing:1px;font-style:italic}
    .marker-number{font-family:'Playfair Display',serif;font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:#c8a96e;margin-bottom:4px}
    .marker-title{font-family:'Playfair Display',serif;font-size:1.3rem;color:#1a1008;margin-bottom:14px;line-height:1.2}
    .marker-verses{font-family:'IM Fell English',serif;font-style:italic;font-size:.95rem;line-height:1.9;color:#5c3a1a;border-left:2px solid #c8a96e;padding-left:14px;margin-bottom:14px}
    .marker-how{font-size:.78rem;color:#7a5c2e;line-height:1.6;background:rgba(200,169,110,.12);border-radius:2px;padding:8px 10px}
    .marker-how strong{color:#5c3a1a}
    footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #c8a96e;font-family:'Crimson Text',serif;font-size:.8rem;color:#c8a96e;letter-spacing:2px}
    .print-btn{display:block;margin:24px auto 0;font-family:'Playfair Display',serif;font-size:.95rem;color:#1a1008;background:#c8a96e;border:none;padding:12px 36px;cursor:pointer;letter-spacing:1px}
    .print-btn:hover{background:#7a5c2e;color:white}
    @media print{body{background:white;padding:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.marker-item{page-break-inside:avoid}.no-print{display:none!important}}
  </style>
</head>
<body>
  <header class="page-header">
    <h1 class="page-title" id="page-title"></h1>
    <p class="page-sub" id="page-sub"></p>
    <p class="instruction" id="page-instruction"></p>
    <button class="print-btn no-print" id="print-btn"></button>
  </header>

  <div class="markers-grid" id="markers-grid"></div>

  <footer id="page-footer"></footer>

  <script>
    (async function(){
      var response = await fetch('../data/texts.json', { cache: 'no-store' });
      if (!response.ok) {
        console.error('Unable to load ../data/texts.json');
        return;
      }

      var texts = await response.json();
      var page = texts.markersPage || {};
      var poems = Array.isArray(texts.poems) ? texts.poems : [];

      document.title = page.title ? page.title + ' - Marcadores' : document.title;
      document.getElementById('page-title').textContent = page.title || 'A Arvore dos Versos';
      document.getElementById('page-sub').textContent = page.subtitle || '';
      document.getElementById('page-instruction').innerHTML = [
        page.instructionLine1 || '',
        page.instructionLine2 || '',
        page.instructionLine3 || ''
      ].join('<br>');

      var printBtn = document.getElementById('print-btn');
      printBtn.textContent = page.printButton || 'Imprimir Marcadores';
      printBtn.addEventListener('click', function() { window.print(); });

      document.getElementById('page-footer').textContent = page.footer || '';

      var grid = document.getElementById('markers-grid');
      var markerPrefix = page.markerPrefix || 'Marcador ';

      poems.forEach(function(poem, index){
        var marker = poem.marker || {};
        var markerRoman = marker.roman || String(index + 1);
        var markerLabel = marker.label || ('Poema ' + markerRoman);
        var qrCode = marker.qrCode || '';
        var verses = Array.isArray(poem.verses) ? poem.verses : [];

        var item = document.createElement('div');
        item.className = 'marker-item';

        item.innerHTML = [
          '<div class="marker-qr-wrap">',
          '  <div class="marker-frame"><div class="qr-container" id="qr-' + (index + 1) + '"></div></div>',
          '  <span class="marker-id-label">' + markerPrefix + markerRoman + '</span>',
          '  <span class="marker-qr-code">' + qrCode + '</span>',
          '</div>',
          '<div class="marker-info">',
          '  <div class="marker-number">' + markerLabel + '</div>',
          '  <div class="marker-title">' + (poem.title || '') + '</div>',
          '  <div class="marker-verses">' + verses.join('<br>') + '</div>',
          '  <div class="marker-how"><strong>Mundo 3D:</strong> ' + (marker.how || '') + '<br>Aponta a camara para o QR e a leitura e automatica.</div>',
          '</div>'
        ].join('');

        grid.appendChild(item);

        var target = document.getElementById('qr-' + (index + 1));
        if (target && qrCode) {
          new QRCode(target, {
            text: qrCode,
            width: 144,
            height: 144,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      });
    })();
  </script>
</body>
</html>
